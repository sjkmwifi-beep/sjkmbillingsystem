<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Apply — SJKM NETWORK DATA LINK</title>
    <link rel="icon" href="https://sjkmdatalink.isproph.com/storage/company/sjkm-data-link-bUVlA3/favicon_1785149072.png">    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <style>
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:'Inter',sans-serif; min-height:100vh; background:#f1f5f9; display:flex; align-items:center; justify-content:center; padding:24px; }
        .card { background:#fff; border-radius:20px; padding:36px; width:100%; max-width:540px; box-shadow:0 10px 40px rgba(0,0,0,.08); }
        .brand { text-align:center; margin-bottom:18px; }
        .brand img { height:48px; width:auto; object-fit:contain; }
        .brand-fallback { width:52px; height:52px; margin:0 auto; background:linear-gradient(135deg,#6366f1,#8b5cf6); border-radius:12px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:22px; }
        h2 { font-size:23px; font-weight:800; color:#111827; margin-bottom:4px; text-align:center; }
        .sub { font-size:14px; color:#6b7280; margin-bottom:24px; text-align:center; }
        .form-group { margin-bottom:16px; }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
        .form-label { display:block; font-size:13px; font-weight:600; color:#374151; margin-bottom:6px; }
        .req { color:#ef4444; }
        .form-control { width:100%; padding:11px 14px; border:1.5px solid #e5e7eb; border-radius:10px; font-size:14px; font-family:'Inter',sans-serif; outline:none; transition:all .2s; color:#111827; background:#fff; }
        .form-control:focus { border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.1); }
        textarea.form-control { resize:vertical; }
        .form-error { color:#ef4444; font-size:12px; margin-top:4px; }
        .form-hint { font-size:12px; color:#6b7280; margin-top:6px; }
        .btn { width:100%; padding:13px; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; border:none; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; margin-top:8px; }
        .btn-ghost { background:#f3f4f6; color:#374151; border:1px solid #e5e7eb; padding:8px 12px; border-radius:9px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; }
        .login-link { text-align:center; margin-top:20px; font-size:13px; color:#6b7280; }
        .login-link a { color:#6366f1; font-weight:600; }
        .error-box { background:#fee2e2; color:#991b1b; border:1px solid #fecaca; padding:12px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; }
        #applyMap { height:240px; border-radius:10px; border:1px solid #e5e7eb; z-index:0; }
        @media (max-width:560px){ .form-row { grid-template-columns:1fr; } }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
                            <img src="https://sjkmdatalink.isproph.com/storage/company/sjkm-data-link-bUVlA3/sidebar_1785149072.png" alt="SJKM NETWORK DATA LINK">
                    </div>
        <h2>Apply for Service</h2>
        <p class="sub">Submit your application to SJKM NETWORK DATA LINK — our team will review it before activating your account.</p>

        
        <form method="POST" action="https://sjkmdatalink.isproph.com/apply">
            <input type="hidden" name="_token" value="IG08ekgS4VarS4wsbukjpvX6pgwwvHrtdrjXYcdz" autocomplete="off">            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Full Name <span class="req">*</span></label>
                    <input type="text" name="name" class="form-control" value="" placeholder="John Smith" required autofocus>
                                    </div>
                <div class="form-group">
                    <label class="form-label">Phone <span class="req">*</span></label>
                    <input type="text" name="phone" class="form-control" value="" placeholder="+63 9xx xxx xxxx" required>
                                    </div>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address <span class="req">*</span></label>
                <input type="email" name="email" class="form-control" value="" placeholder="you@example.com" required>
                            </div>

            <div class="form-group">
                <label class="form-label">Service Address <span class="req">*</span></label>
                <textarea name="address" class="form-control" rows="2" placeholder="House no., street, barangay, city" required></textarea>
                            </div>

            <div class="form-group">
                <label class="form-label">Choose Plan <span class="req">*</span></label>
                <select name="requested_plan_id" class="form-control" required>
                    <option value="" disabled selected>— Select a plan —</option>
                                    </select>
                <div class="form-hint">The plan you'd like. Our team will confirm availability at your location.</div>
                            </div>

            <div class="form-group">
                <label class="form-label">Your Location <span style="color:#9ca3af;font-weight:500">(optional — helps us check coverage)</span></label>
                <div style="font-size:12px;color:#6b7280;margin-bottom:8px"><i class="fas fa-map-marker-alt"></i> Click the map to drop a pin, or use your current location.</div>
                <div id="applyMap"></div>
                <button type="button" id="useMyLocation" class="btn-ghost" style="margin-top:8px"><i class="fas fa-location-arrow"></i> Use my current location</button>
                <div class="form-row" style="margin-top:12px">
                    <div class="form-group" style="margin-bottom:0">
                        <label class="form-label">Latitude</label>
                        <input type="text" id="latitude" name="latitude" class="form-control" value="" placeholder="14.5995">
                                            </div>
                    <div class="form-group" style="margin-bottom:0">
                        <label class="form-label">Longitude</label>
                        <input type="text" id="longitude" name="longitude" class="form-control" value="" placeholder="120.9842">
                                            </div>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Password <span class="req">*</span></label>
                    <input type="password" name="password" class="form-control" placeholder="Min. 8 characters" required>
                                    </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password <span class="req">*</span></label>
                    <input type="password" name="password_confirmation" class="form-control" placeholder="Repeat password" required>
                </div>
            </div>

            <button type="submit" class="btn"><i class="fas fa-paper-plane"></i> Submit Application</button>
        </form>
        <div class="login-link">Already have an account? <a href="https://sjkmdatalink.isproph.com/login">Sign in</a></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
    (function () {
        var DEFAULT = [14.5995, 120.9842]; // Manila
        var latInput = document.getElementById('latitude');
        var lngInput = document.getElementById('longitude');
        var hasCoords = latInput.value && lngInput.value;
        var start = hasCoords ? [parseFloat(latInput.value), parseFloat(lngInput.value)] : DEFAULT;

        var map = L.map('applyMap').setView(start, hasCoords ? 16 : 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        var marker = null;
        function place(lat, lng) {
            if (marker) { marker.setLatLng([lat, lng]); }
            else {
                marker = L.marker([lat, lng], { draggable: true }).addTo(map);
                marker.on('dragend', function (e) {
                    var p = e.target.getLatLng();
                    latInput.value = p.lat.toFixed(7);
                    lngInput.value = p.lng.toFixed(7);
                });
            }
        }
        if (hasCoords) place(start[0], start[1]);

        map.on('click', function (e) {
            place(e.latlng.lat, e.latlng.lng);
            latInput.value = e.latlng.lat.toFixed(7);
            lngInput.value = e.latlng.lng.toFixed(7);
        });

        function syncFromInputs() {
            var lat = parseFloat(latInput.value), lng = parseFloat(lngInput.value);
            if (!isNaN(lat) && !isNaN(lng)) { place(lat, lng); map.setView([lat, lng], 16); }
        }
        latInput.addEventListener('change', syncFromInputs);
        lngInput.addEventListener('change', syncFromInputs);

        var geoBtn = document.getElementById('useMyLocation');
        if (geoBtn && navigator.geolocation) {
            geoBtn.addEventListener('click', function () {
                geoBtn.disabled = true;
                navigator.geolocation.getCurrentPosition(function (pos) {
                    var lat = pos.coords.latitude, lng = pos.coords.longitude;
                    place(lat, lng); map.setView([lat, lng], 16);
                    latInput.value = lat.toFixed(7);
                    lngInput.value = lng.toFixed(7);
                    geoBtn.disabled = false;
                }, function () {
                    alert('Unable to get your location.');
                    geoBtn.disabled = false;
                });
            });
        }

        setTimeout(function () { map.invalidateSize(); }, 250);
    })();
    </script>
</body>
</html>
