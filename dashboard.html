<!DOCTYPE html>
<html lang="en" class="">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — ISPRO PH</title>
    <script>(function(){try{if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.classList.add('dark');}}catch(e){}})();</script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --page-bg:#f1f5f9;
            --card-bg:#ffffff;
            --card-shadow:0 10px 40px rgba(0,0,0,.08);
            --title:#111827;
            --text-muted:#6b7280;
            --label:#374151;
            --input-bg:#ffffff;
            --input-border:#e5e7eb;
            --input-text:#111827;
            --icon:#9ca3af;
            --brand:#6366f1;
            --brand-soft:rgba(99,102,241,.1);
            --divider-line:#e5e7eb;
            --admin-border:#e5e7eb;
            --admin-hover-bg:#f5f3ff;
            --footer:#9ca3af;
            --error-bg:#fee2e2; --error-text:#991b1b; --error-border:#fecaca;
            --status-bg:#d1fae5; --status-text:#065f46; --status-border:#a7f3d0;
            --btn-grad-a:#374151de; --btn-grad-b:#0f172a;
        }
        html.dark {
            --page-bg:#0b1220;
            --card-bg:#151d2e;
            --card-shadow:0 10px 40px rgba(0,0,0,.5);
            --title:#f1f5f9;
            --text-muted:#94a3b8;
            --label:#cbd5e1;
            --input-bg:#0f172a;
            --input-border:#334155;
            --input-text:#f1f5f9;
            --icon:#64748b;
            --brand:#818cf8;
            --brand-soft:rgba(129,140,248,.15);
            --divider-line:#334155;
            --admin-border:#334155;
            --admin-hover-bg:#1e293b;
            --footer:#64748b;
            --error-bg:rgba(239,68,68,.14); --error-text:#fca5a5; --error-border:rgba(239,68,68,.35);
            --status-bg:rgba(16,185,129,.14); --status-text:#6ee7b7; --status-border:rgba(16,185,129,.35);
            --btn-grad-a:#4f46e5; --btn-grad-b:#312e81;
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:'Inter',sans-serif; min-height:100vh; display:flex; background:var(--page-bg); transition:background .2s ease; }
        .left-panel { width:45%; background:linear-gradient(145deg,#0f172a 0%,#1e1b4b 60%,#312e81 100%); padding:48px; display:flex; flex-direction:column; justify-content:space-between; }
        .brand { display:flex; align-items:center; gap:12px; }
        .brand-icon { width:44px; height:44px; background:linear-gradient(135deg,#6366f1,#8b5cf6); border-radius:12px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; }
        .brand-name { font-size:20px; font-weight:800; color:#fff; }
        .brand-sub { font-size:12px; color:#a5b4fc; }
        .panel-content { flex:1; display:flex; flex-direction:column; justify-content:center; padding:32px 0; }
        .panel-headline { font-size:36px; font-weight:800; color:#fff; line-height:1.2; margin-bottom:16px; }
        .panel-sub { font-size:16px; color:#a5b4fc; line-height:1.6; margin-bottom:40px; }
        .feature-list { display:flex; flex-direction:column; gap:16px; }
        .feature-item { display:flex; align-items:flex-start; gap:14px; }
        .feature-icon { width:40px; height:40px; background:rgba(99,102,241,.2); border-radius:10px; display:flex; align-items:center; justify-content:center; color:#a5b4fc; font-size:16px; flex-shrink:0; }
        .feature-text strong { display:block; color:#fff; font-size:14px; font-weight:600; }
        .feature-text span { color:#94a3b8; font-size:13px; }
        .right-panel { flex:1; display:flex; align-items:center; justify-content:center; background:var(--page-bg); padding:32px; transition:background .2s ease; }
        .login-card { background:var(--card-bg); border-radius:20px; padding:40px; width:100%; max-width:440px; box-shadow:var(--card-shadow); transition:background .2s ease, box-shadow .2s ease; }
        .login-title { font-size:24px; font-weight:800; color:var(--title); margin-bottom:4px; }
        .login-sub { font-size:14px; color:var(--text-muted); margin-bottom:32px; }
        .form-group { margin-bottom:16px; }
        .form-label { display:block; font-size:13px; font-weight:600; color:var(--label); margin-bottom:6px; }
        .input-wrapper { position:relative; }
        .input-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--icon); font-size:14px; }
        .toggle-password { position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--icon); font-size:14px; cursor:pointer; background:none; border:none; padding:0; line-height:1; }
        .toggle-password:hover { color:var(--brand); }
        .form-control { width:100%; padding:12px 14px 12px 40px; border:1.5px solid var(--input-border); border-radius:10px; font-size:14px; font-family:'Inter',sans-serif; outline:none; transition:all .2s; color:var(--input-text); background:var(--input-bg); }
        .form-control::placeholder { color:var(--icon); }
        .form-control:focus { border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft); }
        .form-options { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
        .remember-me { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--text-muted); cursor:pointer; }
        .remember-me input { width:16px; height:16px; accent-color:var(--brand); }
        .forgot-link { font-size:13px; color:var(--brand); font-weight:500; }
        .btn-submit { width:100%; padding:13px; background:linear-gradient(135deg, var(--btn-grad-a), var(--btn-grad-b)); color:#fff; border:none; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; font-family:'Inter',sans-serif; }
        .btn-submit:hover { opacity:.9; }
        .divider { text-align:center; margin:24px 0; position:relative; }
        .divider::before { content:''; position:absolute; left:0; right:0; top:50%; height:1px; background:var(--divider-line); }
        .divider span { background:var(--card-bg); padding:0 12px; font-size:12px; color:var(--icon); position:relative; }
        .admin-link { display:flex; align-items:center; justify-content:center; gap:8px; padding:10px; border:1.5px solid var(--admin-border); border-radius:10px; color:var(--text-muted); font-size:13px; font-weight:500; }
        .admin-link:hover { border-color:var(--brand); color:var(--brand); background:var(--admin-hover-bg); }
        .error-msg { background:var(--error-bg); color:var(--error-text); border:1px solid var(--error-border); padding:12px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
        .status-msg { background:var(--status-bg); color:var(--status-text); border:1px solid var(--status-border); padding:12px 14px; border-radius:8px; font-size:13px; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
        .login-footer { font-size:12px; color:var(--footer); text-align:center; }
        .signup-hint { text-align:center; margin-top:18px; font-size:13px; color:var(--text-muted); }
        .signup-hint a { color:var(--brand); font-weight:600; }
        @media (max-width:768px) { .left-panel { display:none; } .right-panel { padding:24px; } }
    </style>
</head>
<body>
        <div class="right-panel">
        <div style="display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:440px">
            <div class="login-card">
                <div style="text-align:center;margin-bottom:22px">
                                            <img src="https://sjkmdatalink.isproph.com/storage/company/sjkm-data-link-bUVlA3/sidebar_1785149072.png" alt="SJKM NETWORK DATA LINK" style="height:48px;width:auto;object-fit:contain">
                                    </div>
                <h2 class="login-title">Welcome back</h2>
            <p class="login-sub">Sign in to your account to continue</p>
                                    <form method="POST" action="https://sjkmdatalink.isproph.com/login">
                <input type="hidden" name="_token" value="mzUafRaRIlOTM72cNZSW6TeRsbIBut2k3asvJGG3" autocomplete="off">                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" name="email" class="form-control" value="" placeholder="you@example.com" required autofocus>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required style="padding-right:40px">
                        <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Show password"><span id="togglePasswordIcon" style="display:inline-flex"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg></span></button>
                    </div>
                </div>
                <div class="form-options">
                    <label class="remember-me"><input type="checkbox" name="remember"> Remember me</label>
                    <a href="https://sjkmdatalink.isproph.com/forgot-password" class="forgot-link">Forgot password?</a>
                </div>
                <button type="submit" class="btn-submit"><i class="fas fa-sign-in-alt"></i> Sign In</button>
            </form>
                        <div class="signup-hint">New customer? <a href="https://sjkmdatalink.isproph.com/apply">Apply for service</a></div>
                        </div>
            <div class="login-footer">&copy; 2026 iSPRO PH. All rights reserved.</div>
        </div>
    </div>
    <script>
        function togglePassword() {
            var input = document.getElementById('password');
            var span = document.getElementById('togglePasswordIcon');
            var eye = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>';
            var eyeOff = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>';
            if (input.type === 'password') {
                input.type = 'text';
                span.innerHTML = eyeOff;
            } else {
                input.type = 'password';
                span.innerHTML = eye;
            }
        }
    </script>
</body>
</html>
